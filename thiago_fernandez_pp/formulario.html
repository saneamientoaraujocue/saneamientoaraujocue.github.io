<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen Web - Página 2 (Formulario)</title>
 <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  
  <main class="contenedor-formulario">

    <h1>Formulario de Inscripción</h1>

<img src="https://picsum.photos/id/0/800/300" alt="Imagen principal">
    <p>Completa el siguiente formulario con tus datos para recibir más información
      sobre nuestros cursos de desarrollo web. Todos los campos son obligatorios.</p>

    <form action="#" method="post">

     <div>
        <label for="nombre">Nombres y Apellidos:</label>
        <input 
        type="text" 
        name="nombre" 
        id="nombre" 
        placeholder="Tu Nombre y Apellido" required
        >
      </div>
        
      
      <div>
          <label for="email">Email</label>
          <input
           type="email"
          name="email"
          placeholder="ejemplo@examem.com"required
          >
        </div>
       
       
        <div>
          <label for="mensaje">Mensaje:</label>
          <textarea 
          name="Mensaje" 
          id="Mensaje"
          placeholder="Describenos tu experiencia aquí   "
          ></textarea>
        </div>
      <button type="submit">Enviar inscripción</button>

    </form>

    <a href="index.html" class="enlace">← Volver a la página principal</a>

  </main>

</body>

</html>
